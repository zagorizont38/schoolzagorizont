# Сборка и публикация сайта на GitHub Pages.
# Запускается при каждом сохранении из админки (коммит в main) и вручную во вкладке Actions.
name: Сборка и публикация сайта

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать сайт из content/site.json
        run: node tools/build.mjs _site
      - name: Настроить Pages
        uses: actions/configure-pages@v5
      - name: Упаковать сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
